<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Pytanie 10: Fizjologia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #061910; /* Dark green background based on UI screenshot */
            color: #e2e8f0;
        }
        .bg-quiz-card {
            background-color: #03130b;
        }
        .border-quiz {
            border-color: #113824;
        }
        .btn-correct {
            background-color: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #34d399;
        }
        .btn-option {
            background-color: rgba(15, 45, 30, 0.4);
            border-color: #113824;
            color: #9ae6b4;
        }
        .btn-option:hover {
            background-color: rgba(22, 65, 43, 0.6);
        }
        .explanation-box {
            background-color: rgba(11, 38, 25, 0.8);
            border: 1px solid #113824;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-4xl space-y-6">
        <!-- Quiz Card -->
        <div class="bg-quiz-card border border-quiz rounded-xl p-6 md:p-8 shadow-2xl">
            
            <!-- Category Header -->
            <div class="flex items-center space-x-2 text-xs md:text-sm font-medium text-amber-500 mb-4">
                <span>Pytanie 10</span>
                <span>•</span>
                <span>Fizjologia</span>
                <span>•</span>
                <span>Homeostaza i Układy Regulacji</span>
            </div>

            <!-- Question Title -->
            <h1 class="text-lg md:text-xl font-bold text-white mb-6 leading-relaxed">
                Jaki stan patologiczny został wymieniony w notatkach jako przykład zaburzenia sprzężenia zwrotnego ujemnego?
            </h1>

            <!-- Options Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Option A (Correct Answer) -->
                <button class="btn-correct border-2 rounded-lg p-4 text-left font-medium flex items-center justify-between transition-all duration-200">
                    <span>A. Niedoczynność tarczycy.</span>
                    <i class="fa-solid fa-check text-emerald-400 text-lg ml-2"></i>
                </button>

                <!-- Option B -->
                <button class="btn-option border rounded-lg p-4 text-left font-medium flex items-center justify-between transition-all duration-200 cursor-pointer">
                    <span>B. Apoptoza kardiomiocytów.</span>
                </button>

                <!-- Option C -->
                <button class="btn-option border rounded-lg p-4 text-left font-medium flex items-center justify-between transition-all duration-200 cursor-pointer">
                    <span>C. Złamana kość udowa.</span>
                </button>

                <!-- Option D -->
                <button class="btn-option border rounded-lg p-4 text-left font-medium flex items-center justify-between transition-all duration-200 cursor-pointer">
                    <span>D. Nużeniec ludzki.</span>
                </button>
            </div>

            <!-- Explanation Box -->
            <div class="explanation-box rounded-lg p-4 text-sm md:text-base">
                <p class="text-amber-500 font-semibold inline">Wyjaśnienie: </p>
                <span class="text-emerald-200">W notatkach jako przykład zaburzenia sprzężenia zwrotnego ujemnego podano niedoczynność tarczycy.</span>
            </div>

        </div>
    </div>

</body>
</html>
